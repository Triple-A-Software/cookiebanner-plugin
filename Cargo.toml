[package]
name = "cookie-banner"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
axum-extra = { version = "0.10", features = ["form"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tower-http = { version = "0.6", features = ["normalize-path", "fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "chrono"] }
ssr-html = { git = "https://codeberg.org/blechlawine/ssr-html" }
ssr-html-macros = { git = "https://codeberg.org/blechlawine/ssr-html" }

tracing = "0.1"
tracing-subscriber = "0.3"
